<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cycletowns — MVP Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
/* ============================================================
   CYCLE TOWNS — MVP demo (rider app + admin backend)
   Brand: Teal #01536C · Coral #FD3D35 · Charcoal #191919
   Type:  League Gothic (display) · Plus Jakarta Sans (UI)
   Single file · no dependencies · in-memory demo DB
   ============================================================ */
:root{
  --teal:#01536C; --teal-700:#013E52; --teal-050:#E6EFF2;
  --coral:#FD3D35; --coral-700:#E22A22; --coral-050:#FFEBEA;
  --charcoal:#191919; --ink:#191919;
  --grey-d:#5B5B5B; --grey-m:#A0A0A0; --grey-l:#DBDBDB;
  --paper:#F3F5F6; --line:#E7EAEC; --card:#FFFFFF; --white:#fff;
  --disp:'League Gothic','Oswald','Arial Narrow',sans-serif;
  --ui:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --shadow:0 16px 40px rgba(25,25,25,.16);
  --shadow-sm:0 4px 14px rgba(25,25,25,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);color:var(--ink);background:#0d1417;line-height:1.45;-webkit-font-smoothing:antialiased}
.view{display:none}
.view.active{display:block}

/* ---------- shared bits ---------- */
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.5px;font-weight:400;line-height:.95}
button{font-family:var(--ui);cursor:pointer}
.btn{width:100%;padding:15px;border:none;border-radius:13px;font-size:15px;font-weight:700;transition:transform .1s,box-shadow .2s,background .2s;letter-spacing:.2px}
.btn:active{transform:translateY(1px)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 10px 22px rgba(253,61,53,.30)}
.btn-coral:hover{background:var(--coral-700)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-700)}
.btn-ghost{background:#fff;color:var(--teal);border:1.6px solid var(--line)}
.btn-ghost:hover{border-color:var(--teal);background:var(--teal-050)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:9px 14px;width:auto;border-radius:10px;font-size:13px}
.row{display:flex;gap:10px}
.spacer{flex:1}
.muted{color:var(--grey-d)}
.backlink{display:inline-flex;gap:6px;align-items:center;background:none;border:none;color:var(--grey-d);font-weight:700;font-size:13px;padding:4px 0;margin-bottom:6px}
.backlink:hover{color:var(--ink)}

/* ============ APP (phone) VIEW ============ */
#appView{min-height:100vh;display:none;align-items:center;justify-content:center;padding:22px 12px;
  background:radial-gradient(1100px 540px at 50% -8%, #0c4256 0%, transparent 55%),linear-gradient(165deg,#0a1418,#0e2730 60%,#0a1418)}
#appView.active{display:flex}
.device{width:100%;max-width:428px;height:872px;max-height:94vh;background:var(--paper);border-radius:44px;border:11px solid #05262f;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:9px 24px 3px;font-size:13px;font-weight:800;color:var(--ink);background:var(--paper);flex-shrink:0}
.statusbar .sig{display:flex;gap:5px;align-items:center;font-size:11px;font-weight:700}
.appheader{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;background:var(--paper);flex-shrink:0;border-bottom:1px solid var(--line)}
.appheader .logo{height:26px}
.ptspill{display:inline-flex;align-items:center;gap:6px;background:var(--coral-050);color:var(--coral-700);font-weight:800;font-size:12.5px;padding:6px 11px;border-radius:99px;border:1px solid #ffd9d6}
.appbody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.appbody::-webkit-scrollbar{width:0}
.screen{display:none;padding:18px 18px 30px;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.appnav{display:flex;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid var(--line);padding:9px 6px calc(9px + env(safe-area-inset-bottom));flex-shrink:0}
.appnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--grey-m);font-size:10.5px;font-weight:700;padding:3px 12px}
.appnav button.on{color:var(--coral)}
.appnav svg{width:23px;height:23px}

/* headings */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--coral)}
h1.title{font-family:var(--disp);text-transform:uppercase;font-size:38px;line-height:.95;color:var(--ink);margin:5px 0 6px;letter-spacing:.5px}
h2.sec{font-family:var(--disp);text-transform:uppercase;font-size:24px;letter-spacing:.5px;color:var(--ink);margin:2px 0}
p.sub{color:var(--grey-d);font-size:14px;margin-bottom:16px}

/* fields */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 13px;border:1.6px solid var(--line);border-radius:12px;font-size:15px;font-family:var(--ui);background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(1,83,108,.10)}
.field input.bad{border-color:var(--coral);box-shadow:0 0 0 4px rgba(253,61,53,.10)}
.pw{position:relative}.pw button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--teal);font-weight:700;font-size:12px}
.err{color:var(--coral-700);font-size:12px;margin-top:5px;display:none;font-weight:600}.err.show{display:block}
.hint{color:var(--grey-m);font-size:12px;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border:1.6px solid var(--line);border-radius:99px;background:#fff;font-size:13px;font-weight:700;color:var(--ink);transition:.12s}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:11px 14px;border:1.6px solid var(--line);border-radius:12px;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink);flex:1;min-width:46%;text-align:center;transition:.12s}
.opt.on{background:var(--teal-050);border-color:var(--teal);color:var(--teal-700);font-weight:800}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle .tx{font-size:13.5px;font-weight:600}.toggle .tx small{display:block;color:var(--grey-m);font-weight:500;font-size:12px;margin-top:2px}
.switch{width:46px;height:27px;border-radius:99px;background:var(--grey-l);position:relative;border:none;flex-shrink:0;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch.on{background:var(--teal)}.switch.on::after{left:22px}
.checkrow{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:6px 0}
.checkrow input{margin-top:2px;width:18px;height:18px;accent-color:var(--teal);flex-shrink:0}
.checkrow span{font-size:12.5px;color:var(--grey-d);line-height:1.4}
.progress{height:5px;background:var(--grey-l);border-radius:99px;margin-bottom:14px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--coral));border-radius:99px;transition:width .4s}

/* welcome */
.welcome-hero{height:230px;border-radius:18px;overflow:hidden;margin-bottom:18px;position:relative}
.welcome-hero .ov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;background:linear-gradient(transparent,rgba(25,25,25,.55))}
.welcome-hero .ov b{color:#fff;font-family:var(--disp);font-size:22px;text-transform:uppercase;letter-spacing:.5px;line-height:1}

/* town cards */
.townsgrid{display:grid;grid-template-columns:1fr;gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .2s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(25,25,25,.13)}
.tcard .hero{height:140px;position:relative}
.tcard .hero .badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.95);border-radius:10px;padding:4px 9px;font-weight:800;font-size:12.5px;color:var(--ink);display:flex;gap:4px;align-items:center}
.tcard .hero .badge .s{color:var(--coral)}
.tcard .hero .flag{position:absolute;top:10px;left:10px;font-size:20px;background:rgba(255,255,255,.92);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px}
.tcard .meta{padding:12px 13px 14px}
.tcard .meta .nm{font-family:var(--disp);text-transform:uppercase;font-size:22px;color:var(--ink);letter-spacing:.4px;line-height:1}
.tcard .meta .rg{font-size:12.5px;color:var(--grey-d);margin-top:2px}
.tcard .meta .tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;color:var(--teal-700);background:var(--teal-050);padding:3px 8px;border-radius:99px}
.tag.coral{color:var(--coral-700);background:var(--coral-050)}
.tcard .meta .rd{font-size:12px;color:var(--grey-m);font-weight:600;margin-top:8px}

/* town detail */
.thero{height:210px;border-radius:0 0 22px 22px;position:relative;margin:-18px -18px 14px}
.thero .ovr{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 40%,rgba(25,25,25,.65))}
.thero .ttl{font-family:var(--disp);text-transform:uppercase;font-size:42px;color:#fff;letter-spacing:.5px;line-height:.9}
.thero .sb{color:#fff;opacity:.92;font-size:13px;font-weight:600;margin-top:3px}
.thero .flag{position:absolute;top:14px;left:14px;font-size:22px;background:rgba(255,255,255,.92);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.statrow{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.stat .v{font-family:var(--disp);font-size:26px;color:var(--teal);line-height:1}
.stat .v.coral{color:var(--coral)}
.stat .l{font-size:10.5px;color:var(--grey-d);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.subtabs{display:flex;gap:8px;margin-bottom:12px}
.subtab{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--grey-d)}
.subtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* group cards */
.gcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px;display:flex;gap:12px;align-items:center}
.gicon{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--teal-050)}
.gcard .gb{flex:1;min-width:0}
.gcard .gn{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:7px}
.gcard .gd{font-size:12.5px;color:var(--grey-d);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gcard .gm{font-size:11.5px;color:var(--grey-m);font-weight:600;margin-top:5px}
.privacy{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:6px}
.privacy.pub{background:var(--teal-050);color:var(--teal-700)}
.privacy.prv{background:#FFF3E0;color:#9A5B00}

/* feed */
.post{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px}
.post .ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post .av{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.post .who{font-weight:700;font-size:13.5px}.post .when{font-size:11.5px;color:var(--grey-m)}
.post .body{font-size:13.5px;color:#2a2a2a}
.post .tagline{font-size:11.5px;color:var(--teal-700);font-weight:700;margin-top:7px}

/* badges/profile */
.badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.bdg .ic{font-size:26px}.bdg .bn{font-size:11px;font-weight:700;margin-top:4px;color:var(--ink)}
.bdg.lock{opacity:.45}

/* success */
.seal{width:78px;height:78px;border-radius:50%;background:var(--coral);margin:8px auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(253,61,53,.4);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* toast + view toggle */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:88%;text-align:center}
#viewToggle{position:fixed;bottom:16px;right:16px;z-index:80;background:#fff;color:var(--ink);border:1.6px solid var(--line);border-radius:99px;padding:9px 15px;font-weight:800;font-size:12.5px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:7px}
#viewToggle:hover{border-color:var(--teal)}
#viewToggle .dot{width:8px;height:8px;border-radius:50%;background:var(--coral)}

/* ============ ADMIN VIEW ============ */
#adminView{min-height:100vh;background:var(--paper);color:var(--ink)}
.admin-wrap{display:flex;min-height:100vh}
.adsidebar{width:230px;background:var(--charcoal);color:#fff;flex-shrink:0;padding:20px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.adsidebar .brand{margin-bottom:18px}
.adsidebar .navi{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:#cdd3d6;font-weight:600;font-size:14px;border:none;background:none;width:100%;text-align:left}
.adsidebar .navi:hover{background:rgba(255,255,255,.07);color:#fff}
.adsidebar .navi.on{background:var(--teal);color:#fff}
.adsidebar .navi svg{width:18px;height:18px;opacity:.9}
.adsidebar .role{margin-top:auto;font-size:12px;color:var(--grey-m);border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.admain{flex:1;padding:26px 30px 50px;max-width:1280px}
.adtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.adtop h1{font-family:var(--disp);text-transform:uppercase;font-size:34px;letter-spacing:.5px;line-height:1}
.adtop .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--teal-700);background:var(--teal-050);padding:7px 13px;border-radius:99px}
.adtop .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.adsection{display:none}.adsection.on{display:block}
/* board report */
.kpis6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpis6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.kpis6{grid-template-columns:1fr 1fr}}
.adexport{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.adperiod{display:flex;gap:6px;flex-wrap:wrap}
.adpc{border:1px solid var(--line);background:#fff;border-radius:30px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;color:var(--grey-d)}
.adpc.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.adexbtns{display:flex;gap:8px;flex-wrap:wrap}
.funnel{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.fnrow{display:flex;align-items:center;gap:10px;font-size:13px}
.fnrow .fnl{width:74px;flex-shrink:0;color:var(--grey-d);font-weight:700}
.fnrow .fnbar{flex:1;background:var(--paper);border-radius:8px;height:28px;position:relative;overflow:hidden}
.fnrow .fnfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal-700),var(--teal));border-radius:8px}
.fnrow .fnv{width:78px;flex-shrink:0;text-align:right;font-weight:800;font-size:13px;color:var(--ink)}
.fnrow .fnp{width:96px;flex-shrink:0;text-align:right;color:var(--teal);font-weight:800;font-size:12.5px}
.statlist{display:flex;flex-direction:column}
.slrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.slrow:last-child{border-bottom:none}
.slrow span{color:var(--grey-d)}
.slrow b{font-weight:800}
.slrow b.teal{color:var(--teal)}.slrow b.up{color:#177245}.slrow b.coral{color:var(--coral)}
table.cohort{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px;margin-top:4px}
table.cohort th{font-size:10.5px;color:var(--grey-m);font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:4px;text-align:center}
table.cohort td{text-align:center;padding:7px 4px;font-weight:700;border-radius:6px;color:#0a3a49}
table.cohort td.ch{text-align:left;color:var(--ink);font-weight:800;background:transparent}
table.cohort td.cx{background:transparent}
@media(max-width:620px){.fnrow{flex-wrap:wrap}.fnrow .fnl{width:auto;flex:1}.fnrow .fnv{width:auto}.fnrow .fnbar{order:5;flex-basis:100%;margin-top:5px}.fnrow .fnp{width:auto;margin-left:8px}table.cohort{font-size:10.5px;border-spacing:2px}.acard{overflow-x:auto}}
@media print{.adsidebar,.adexport,.adtop .live{display:none!important}.admain{padding:0!important}.acard,.kpi{break-inside:avoid}body{background:#fff}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi .k{font-size:12px;font-weight:700;color:var(--grey-d);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-family:var(--disp);font-size:42px;color:var(--ink);line-height:1;margin-top:6px}
.kpi .d{font-size:12px;font-weight:700;margin-top:5px}
.kpi .d.up{color:#177245}.kpi .d.teal{color:var(--teal)}.kpi .d.coral{color:var(--coral-700)}
.cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.acard.full{grid-column:1/-1}
.acard h3{font-size:14px;font-weight:800;margin-bottom:3px}
.acard .csub{font-size:12px;color:var(--grey-m);margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--grey-d);font-weight:800;padding:8px 10px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:var(--paper)}
.tbl .av{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;margin-right:8px;vertical-align:middle}
.pillv{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--teal-050);color:var(--teal-700)}
.pillv.green{background:#E4F5EA;color:#177245}.pillv.amber{background:#FFF3E0;color:#9A5B00}.pillv.grey{background:#eef0f1;color:var(--grey-d)}
.searchbox{padding:9px 13px;border:1.6px solid var(--line);border-radius:11px;font-size:13.5px;font-family:var(--ui);width:240px}
.searchbox:focus{outline:none;border-color:var(--teal)}
.actlog{max-height:420px;overflow-y:auto}
.actitem{display:flex;gap:11px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}

.tierladder{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

#splash.gone{transform:translateY(-100%);opacity:0;pointer-events:none}

    h+='<div class="chips">'+f.opts.map(function(o){var on=(v||[]).indexOf(o)>=0;return '<button type="button" class="chip'+(on?' on':'')+'" onclick="onbTog(\''+f.id+'\',\''+o.replace(/'/g,"\\'")+'\')">'+o+'</button>';}).join('')+'</div>';
  } else if(f.type==='townpick'){
    h+='<div class="opts">'+TOWNS.map(function(t){return '<button type="button" class="opt'+(v===t.id?' on':'')+'" style="min-width:46%" onclick="onbSet(\'homeTown\',\''+t.id+'\')">'+t.flag+' '+t.name+'</button>';}).join('')+'</div>';
  } else if(f.type==='persona'){
    h+=PERSONAS.map(function(p){return '<button type="button" class="personacard'+(v===p.id?' on':'')+'" onclick="onbSet(\'persona\',\''+p.id+'\')"><span class="pe">'+p.e+'</span><span><span class="pt">'+p.t+'</span><div class="pn">'+p.n+'</div><div class="pdz">'+p.d+'</div></span></button>';}).join('');
  } else if(f.type==='destinations'){
    h+='<div class="chips">'+TOWNS.map(function(t){var on=(v||[]).indexOf(t.id)>=0;return '<button type="button" class="chip'+(on?' on':'')+'" onclick="onbTog(\'dreamDestinations\',\''+t.id+'\')">'+t.flag+' '+t.name+'</button>';}).join('')+'</div>';
  } else if(f.type==='toggle'){
    var on=(v===undefined?f.def:v);h+='<div class="toggle" style="border-top:none;padding-top:2px"><div class="tx">'+f.label+'</div><button class="switch'+(on?' on':'')+'" onclick="onbBool(\''+f.id+'\')"></button></div>';
    return h.replace('<span class="flabel">'+f.label+'</span>','')+'</div>';

  h+='<div class="err" id="e-'+f.id+'">Required.</div></div>';

function renderOnboard(){
  var s=ONB[step];
  var html='<div class="progress"><i style="width:'+((step+1)/ONB.length*100)+'%"></i></div>';
  html+=(step>0?'<button class="backlink" onclick="onbBack()">‹ Back</button>':'');
  html+='<div class="eyebrow">Step '+(step+1)+' of '+ONB.length+'</div><h1 class="title">'+s.title+'</h1>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'');
  html+=s.fields.map(fieldHTML).join('');
  html+='<button class="btn btn-coral" style="margin-top:6px" onclick="onbNext()">'+(step===ONB.length-1?'Join Cycletowns':'Continue')+'</button>';
  document.getElementById('s-onboard').innerHTML=html; show('s-onboard');
}
function captureInputs(){document.querySelectorAll('#s-onboard [data-onb]').forEach(function(el){draft[el.getAttribute('data-onb')]=el.value;});}
function onbSet(id,val){captureInputs();draft[id]=val;renderOnboard();}
function onbTog(id,val){captureInputs();draft[id]=draft[id]||[];var i=draft[id].indexOf(val);if(i>=0)draft[id].splice(i,1);else draft[id].push(val);renderOnboard();}
function onbBool(id){var f=findField(id);if(f.type==='check'){draft[id]=!draft[id];}else{draft[id]=(draft[id]===undefined?!f.def:!draft[id]);}renderOnboard();}
function findField(id){for(var i=0;i<ONB.length;i++)for(var j=0;j<ONB[i].fields.length;j++)if(ONB[i].fields[j].id===id)return ONB[i].fields[j];}
function onbBack(){captureInputs();if(step>0){step--;renderOnboard();}}
function onbNext(){
  captureInputs();var s=ONB[step],ok=true,firstBad=null;
  s.fields.forEach(function(f){
    if(!f.req)return;var v=draft[f.id],bad=false;
    if(f.type==='text')bad=!v||(''+v).trim().length<2;
    else if(f.type==='email')bad=!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v||'');
    else if(f.type==='password')bad=!v||v.length<8;
    else if(f.type==='chips'||f.type==='destinations')bad=!(v&&v.length);
    else if(f.type==='check')bad=!v;
    else bad=!v;
    var e=document.getElementById('e-'+f.id);if(e)e.classList.toggle('show',bad);
    if(bad){ok=false;if(!firstBad)firstBad=f.id;}
  });
  if(!ok){toast('Please complete the highlighted fields');return;}
  if(step<ONB.length-1){step++;renderOnboard();}else finishSignup();
}

/* ---------- navigation history (browser-style back / forward) ---------- */
var HIST=[],HP=-1,histLock=false;
function recordHist(type,arg){if(histLock)return;HIST=HIST.slice(0,HP+1);if(HIST.length&&HIST[HP].type===type&&HIST[HP].arg===arg)return;HIST.push({type:type,arg:arg});HP=HIST.length-1;updateHistBtns();}
function dispatchHist(s){histLock=true;if(s.type==='town')openTown(s.arg);else if(s.type==='group')openGroup(s.arg);else nav(s.arg);histLock=false;updateHistBtns();}
function histBack(){if(HP>0){HP--;dispatchHist(HIST[HP]);}}
function histFwd(){if(HP<HIST.length-1){HP++;dispatchHist(HIST[HP]);}}
function updateHistBtns(){var b=document.getElementById('histBack'),f=document.getElementById('histFwd');if(b)b.disabled=(HP<=0);if(f)f.disabled=(HP>=HIST.length-1);}
function resetHist(){HIST=[];HP=-1;updateHistBtns();}
/* ---- web (guest-side) history so Back returns to the previous page, not home ---- */
var WHIST=[],WHP=-1,whistLock=false;
function sameWeb(a,b){return a.t===b.t&&a.id===b.id&&a.cat===b.cat&&a.scope===b.scope&&a.from===b.from&&a.town===b.town;}
function webPush(s){if(whistLock)return;
  if(s.t==='home'){WHIST=[{t:'home'}];WHP=0;return;}
  if(WHP<0){WHIST=[{t:'home'}];WHP=0;}
  WHIST=WHIST.slice(0,WHP+1);
  if(WHP>=0&&sameWeb(WHIST[WHP],s))return;
  WHIST.push(s);WHP=WHIST.length-1;}
function webBackAvail(){return WHP>0;}
function webBack(){if(WHP<=0){goHome();return;}WHP--;var s=WHIST[WHP];whistLock=true;dispatchWeb(s);whistLock=false;}
function dispatchWeb(s){
  if(s.t==='town')renderWebTown(s.id);
  else if(s.t==='plan')openPlanner(s.from||null);
  else if(s.t==='cat')openCategory(s.cat,s.scope);
  else if(s.t==='shop')renderShop();
  else if(s.t==='rewards')renderMembership();
  else if(s.t==='itin')renderItinerary();
  else if(s.t==='loop')openLoopBuilder(s.town);
  else if(s.t==='news')renderNews();
  else if(s.t==='rankings')renderRankings();
  else if(s.t==='about')renderAbout();
  else if(s.t==='howrank')renderHowRankings();
  else if(s.t==='careers')renderCareers();
  else if(s.t==='contact')renderContact();
  else renderLanding();
  window.scrollTo(0,0);}

function tally(field,isArr){var m={};DB.users.forEach(function(u){var v=u[field];if(v==null||v==='—')return;if(isArr){(v||[]).forEach(function(x){m[x]=(m[x]||0)+1;});}else{m[v]=(m[v]||0)+1;}});return m;}

function topN(map,n,labelFn){var a=Object.keys(map).map(function(k){return {label:labelFn?labelFn(k):k,value:map[k]};});a.sort(function(x,y){return y.value-x.value;});a=a.slice(0,n);a.forEach(function(d,i){d.color=CPAL[i%CPAL.length];});return a;}

/* ---- charts ---- */
function hbars(data){
  var max=Math.max.apply(null,data.map(function(d){return d.value;}))||1;
  return '<div>'+data.map(function(d){
    return '<div style="display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px">'
      +'<span style="width:112px;flex-shrink:0;color:#444;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(d.label)+'</span>'
      +'<span style="flex:1;height:14px;background:#EEF0F1;border-radius:99px;overflow:hidden"><i style="display:block;height:100%;border-radius:99px;width:'+(d.value/max*100).toFixed(1)+'%;background:'+(d.color||'#01536C')+'"></i></span>'
      +'<span style="width:34px;text-align:right;font-weight:800">'+d.value+'</span></div>';
  }).join('')+'</div>';
}
function vbars(data){
  var max=Math.max.apply(null,data.map(function(d){return d.value;}))||1;var bw=40,gap=16,pad=30,H=170,bh=120;
  var W=pad*2+data.length*bw+(data.length-1)*gap;
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;height:auto">';
  data.forEach(function(d,i){var x=pad+i*(bw+gap),h=d.value/max*bh,y=140-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+(d.color||'#01536C')+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#191919">'+d.value+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="158" text-anchor="middle" font-size="10.5" fill="#5B5B5B">'+esc(d.label)+'</text>';
  });
  return s+'</svg>';
}
function donut(segs){
  var total=segs.reduce(function(a,b){return a+b.value;},0)||1,C=2*Math.PI*54,off=0;
  var s='<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg viewBox="0 0 140 140" style="width:130px;height:130px;transform:rotate(-90deg)"><circle cx="70" cy="70" r="54" fill="none" stroke="#EEF0F1" stroke-width="18"/>';
  segs.forEach(function(g){var len=g.value/total*C;s+='<circle cx="70" cy="70" r="54" fill="none" stroke="'+g.color+'" stroke-width="18" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';off+=len;});
  s+='<circle cx="70" cy="70" r="45" fill="#fff"/></svg>';
  s+='<div style="font-size:12.5px">'+segs.map(function(g){return '<div style="margin:4px 0;font-weight:600;color:#444"><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:'+g.color+';margin-right:7px;vertical-align:middle"></i>'+esc(g.label)+' <b style="color:#191919">'+Math.round(g.value/total*100)+'%</b></div>';}).join('')+'</div></div>';
  return s;
}

/* ---- CSV export ---- */
function dl(name,text){var b=new Blob([text],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},200);toast('Exported '+name);}
function csvRow(a){return a.map(function(x){x=(''+(x==null?'':x)).replace(/"/g,'""');return /[",\n]/.test(x)?'"'+x+'"':x;}).join(',');}
function exportUsersCSV(){
  var cols=['handle','fullName','homeTown','riderTypes','ability','volume','ageBand','gender','homeCountry','travelIntent','dreamDestinations','tripBudget','annualSpend','bikeBrands','purchaseIntent','points','partnerOptIn'];
  var lines=[csvRow(cols)];
  DB.users.forEach(function(u){lines.push(csvRow(cols.map(function(c){var v=u[c];return Array.isArray(v)?v.join('|'):v;})));});
  dl('cycletowns_riders.csv',lines.join('\n'));
}
function exportAggCSV(){
  var lines=[csvRow(['metric','segment','count','share_pct'])];
  function add(metric,map,cats){var tot=0;(cats||Object.keys(map)).forEach(function(c){tot+=map[c]||0;});(cats||Object.keys(map)).forEach(function(c){var v=map[c]||0;lines.push(csvRow([metric,c,v,tot?Math.round(v/tot*100):0]));});}
  add('travel_intent',tally('travelIntent'),['Yes, definitely','Maybe','No']);
  add('trip_budget',tally('tripBudget'),BUDGETS);
  add('annual_spend',tally('annualSpend'),SPEND);
  add('ability',tally('ability'),ABILITY);
  add('age_band',tally('ageBand'),AGE_BANDS);
  add('rider_type',tally('riderTypes',true),RIDER_TYPES);
  add('bike_brand',tally('bikeBrands',true),BIKE_BRANDS);
  add('purchase_intent',tally('purchaseIntent',true),PURCHASE);
  add('dream_destination',tally('dreamDestinations',true),TOWNS.map(function(t){return t.id;}));
  add('origin_country',tally('homeCountry'),COUNTRIES);
  dl('cycletowns_partner_aggregates.csv',lines.join('\n'));
}

    pts.push([g.lat,g.lng]);
    return {name:rc.name,note:rc.note,series:rc.series,badge:rc.badge,kind:rc.kind,date:rc.date,status:rc.status,illustrative:!!rc.illustrative,km:m.km,elev:m.elev,level:m.level,ability:m.ability,levelColor:m.levelColor,cat:m.cat,color:'#B8860B',race:true,latlngs:pts};});}

/* ---- lightweight pinned map (lat/lng → svg), the "map as spine" pattern ---- */
function townMapSVG(ids,w,h){var pts=[],i;for(i=0;i<ids.length;i++){var g=TOWN_GEO[ids[i]];if(g)pts.push({id:ids[i],lat:g.lat,lng:g.lng});}
  if(!pts.length)return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg"></svg>';
  var minLa=90,maxLa=-90,minLo=180,maxLo=-180;for(i=0;i<pts.length;i++){minLa=Math.min(minLa,pts[i].lat);maxLa=Math.max(maxLa,pts[i].lat);minLo=Math.min(minLo,pts[i].lng);maxLo=Math.max(maxLo,pts[i].lng);}
  var pLa=(maxLa-minLa)*0.4||3,pLo=(maxLo-minLo)*0.4||3;minLa-=pLa;maxLa+=pLa;minLo-=pLo;maxLo+=pLo;
  function X(lo){return maxLo===minLo?w/2:((lo-minLo)/(maxLo-minLo))*(w-70)+35;}
  function Y(la){return maxLa===minLa?h/2:(1-(la-minLa)/(maxLa-minLa))*(h-54)+27;}
  var grid='',gx;for(i=1;i<6;i++){gx=(i*w/6).toFixed(0);grid+='<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+h+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';}
  for(i=1;i<4;i++){var gy=(i*h/4).toFixed(0);grid+='<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';}
  var pins='';for(i=0;i<pts.length;i++){var t=town(pts[i].id),x=X(pts[i].lng).toFixed(0),y=parseInt(Y(pts[i].lat).toFixed(0)),nm=esc(t?t.name:pts[i].id);
    pins+='<g><circle cx="'+x+'" cy="'+y+'" r="14" fill="rgba(253,61,53,.22)"/><circle cx="'+x+'" cy="'+y+'" r="6" fill="#FD3D35" stroke="#fff" stroke-width="2"/><text x="'+x+'" y="'+(y-13)+'" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" stroke="rgba(8,18,22,.78)" stroke-width="3" paint-order="stroke">'+nm+'</text></g>';}
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+grid+pins+'</svg>';}

function aiCard(type){var recs=AI_RECS[type]||AI_RECS.brand;

  var chips=(AI_CHIPS[type]||[]).map(function(c){return '<button class="aichip" onclick="aiAnswer(\''+type+'\',\''+c[0]+'\')">'+c[1]+'</button>';}).join('');
  return '<div class="aicard"><div class="aitop"><span class="aibadge">🤖 Cycletowns Growth AI</span><span class="aisub">reads your live data and tells you exactly where to grow</span></div>'+rows+'<div class="aiask"><div class="ail">Ask anything about your business</div><div class="aichips">'+chips+'</div><div id="aians_'+type+'" class="aians"></div></div></div>';}

  for(i=0;i<6;i++){
    var plat=r()<0.5?'ig':'tt',nm=pick(r,FIRST),handle='@'+nm.toLowerCase()+pick(r,LAST).toLowerCase()+(10+Math.floor(r()*89)),cap=pick(r,SOC_CAPS),likes=140+Math.floor(r()*5200),reach=likes*(7+Math.floor(r()*9)),days=1+Math.floor(r()*20);totReach+=reach;

  }
